<svg width="860" height="90" viewBox="0 0 860 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Social Button Gradients and Hover Filters -->
    <linearGradient id="grad-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0077b5;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="grad-portfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="grad-gmail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="grad-discord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865f2;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#5865f2;stop-opacity:0.05"/>
    </linearGradient>

    <style>
      .btn {
        transition: transform 0.2s ease, filter 0.2s ease;
        cursor: pointer;
      }
      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.2) drop-shadow(0 4px 8px rgba(124, 58, 237, 0.15));
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="90" fill="#0a0a12"/>

  <!-- Buttons Row (Centered) -->
  <!-- Start X: 110, Y: 25. Width: 140, Height: 40. Gap: 20 -->

  <!-- LinkedIn -->
  <a href="https://www.linkedin.com/in/saishhhhhh/" target="_blank" class="btn">
    <g transform="translate(130, 25)">
      <rect width="130" height="38" rx="19" fill="url(#grad-linkedin)" stroke="#0077b5" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- LinkedIn Icon -->
      <path d="M 22 13 L 22 25 M 18 17 L 18 25 M 18 13 A 1 1 0 0 1 18 11" stroke="#0077b5" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="75" y="24" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">LinkedIn</text>
    </g>
  </a>

  <!-- Portfolio -->
  <a href="https://saishhhhhh.vercel.app/" target="_blank" class="btn">
    <g transform="translate(280, 25)">
      <rect width="130" height="38" rx="19" fill="url(#grad-portfolio)" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- Portfolio Icon (Globe/Vercel shape) -->
      <path d="M 20 12 L 27 24 L 13 24 Z" fill="#7c3aed" fill-opacity="0.8"/>
      <text x="75" y="24" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="13" font-weight="bold" fill="#c4b5fd" text-anchor="middle">Portfolio</text>
    </g>
  </a>

  <!-- Gmail -->
  <a href="mailto:bsaish404@gmail.com" class="btn">
    <g transform="translate(430, 25)">
      <rect width="130" height="38" rx="19" fill="url(#grad-gmail)" stroke="#ea4335" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- Gmail Envelope Icon -->
      <rect x="14" y="14" width="12" height="9" rx="1" stroke="#ea4335" stroke-width="1.5" fill="none"/>
      <path d="M 14 15 L 20 19 L 26 15" stroke="#ea4335" stroke-width="1.5" fill="none"/>
      <text x="75" y="24" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">Gmail</text>
    </g>
  </a>

  <!-- Discord -->
  <a href="https://discord.com/users/saish4593" target="_blank" class="btn">
    <g transform="translate(580, 25)">
      <rect width="130" height="38" rx="19" fill="url(#grad-discord)" stroke="#5865f2" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- Discord Controller Icon -->
      <path d="M 14 16 C 14 14 26 14 26 16 C 26 22 24 24 24 24 C 22 24 21 22 21 22 C 19 22 19 22 19 22 C 19 22 18 24 16 24 C 16 24 14 22 14 16 Z" stroke="#5865f2" stroke-width="1.5" fill="none"/>
      <circle cx="17.5" cy="18" r="1" fill="#5865f2"/>
      <circle cx="22.5" cy="18" r="1" fill="#5865f2"/>
      <text x="75" y="24" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">Discord</text>
    </g>
  </a>
</svg>
