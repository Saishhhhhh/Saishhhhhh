<svg width="860" height="390" viewBox="0 0 860 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ambient glows -->
    <radialGradient id="glow-tr" cx="90%" cy="5%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-bl" cx="10%" cy="95%" r="40%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0"/>
    </radialGradient>

    <!-- card clip -->
    <clipPath id="card-clip">
      <rect x="20" y="16" width="820" height="358" rx="14"/>
    </clipPath>

    <!-- accent gradient -->
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="25%"  style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="50%"  style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="75%"  style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>

    <!-- top bar gradient -->
    <linearGradient id="topbar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#7c3aed;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05"/>
    </linearGradient>

    <!-- cursor glow -->
    <filter id="cursor-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="860" height="390" fill="#0a0a12"/>
  <rect width="860" height="390" fill="url(#glow-tr)"/>
  <rect width="860" height="390" fill="url(#glow-bl)"/>
  <rect width="860" height="390" fill="url(#glow-center)"/>

  <!-- subtle dot grid overlay -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.5" fill="#ffffff" opacity="0.03"/>
  </pattern>
  <rect width="860" height="390" fill="url(#dots)"/>

  <!-- === TERMINAL CARD === -->
  <rect x="20" y="16" width="820" height="358" rx="14" fill="#111120" stroke="#1e1e35" stroke-width="1"/>

  <!-- title bar bg -->
  <rect x="20" y="16" width="820" height="44" rx="14" fill="#161628" clip-path="url(#card-clip)"/>
  <rect x="20" y="48" width="820" height="12" fill="#161628"/>
  <line x1="20" y1="60" x2="840" y2="60" stroke="#1e1e35" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="46" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="38" r="6" fill="#28c840"/>

  <!-- tab pill -->
  <rect x="260" y="25" width="340" height="26" rx="6" fill="#0f0f1c" stroke="#1e1e35" stroke-width="1"/>
  <text x="430" y="43" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#4b5563" text-anchor="middle">saishhhhhh@github: ~/profile  —  zsh</text>

  <!-- ===  JSON CONTENT  === -->

  <!-- prompt line -->
  <text y="92" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14.5">
    <tspan x="44" fill="#a78bfa">❯ </tspan><tspan fill="#4b5563">~ </tspan><tspan fill="#e2e8f0">saish.json</tspan>
  </text>

  <!-- { -->
  <text x="44" y="118" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14.5" fill="#e2e8f0">{</text>

  <!-- "name" -->
  <text y="144" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14">
    <tspan x="62"  fill="#06b6d4">"name"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Saish Baviskar"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "role" -->
  <text y="170" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14">
    <tspan x="62"  fill="#06b6d4">"role"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#fbbf24">[</tspan>
    <tspan fill="#a5f3fc">"AI Engineer"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#a5f3fc">"GenAI Engineer"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#a5f3fc">"AI Builder"</tspan>
    <tspan fill="#fbbf24">]</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "currently" -->
  <text y="196" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14">
    <tspan x="62"  fill="#06b6d4">"currently"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Cantilever Labs · AI Intern"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "location" -->
  <text y="222" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14">
    <tspan x="62"  fill="#06b6d4">"location"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Pune, India 🇮🇳"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "focus" -->
  <text y="248" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14">
    <tspan x="62"  fill="#06b6d4">"focus"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#fbbf24">[</tspan>
    <tspan fill="#c4b5fd">"Agentic AI"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#c4b5fd">"RAG Systems"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#c4b5fd">"LLM Pipelines"</tspan>
    <tspan fill="#fbbf24">]</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "status" -->
  <text y="274" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14">
    <tspan x="62"  fill="#06b6d4">"status"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Hiring season. Hit me up. 🚀"</tspan>
  </text>

  <!-- } -->
  <text x="44" y="300" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14.5" fill="#e2e8f0">}</text>

  <!-- blinking cursor prompt -->
  <text y="330" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="14.5">
    <tspan x="44" fill="#a78bfa">❯ </tspan><tspan fill="#4b5563">~ </tspan>
  </text>
  <rect x="79" y="316" width="9" height="16" rx="1" fill="#a78bfa" filter="url(#cursor-glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent line -->
  <rect x="20" y="372" width="820" height="2" rx="1" fill="url(#accent-line)"/>
</svg>
