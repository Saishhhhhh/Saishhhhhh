<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentbar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="15%" r="40%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="30%" cy="90%" r="30%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="outer">
      <rect width="860" height="300" rx="12"/>
    </clipPath>
    <clipPath id="terminal">
      <rect x="24" y="24" width="812" height="252" rx="10"/>
    </clipPath>
  </defs>

  <!-- outer bg -->
  <rect width="860" height="300" rx="12" fill="#0d0d14" clip-path="url(#outer)"/>
  <rect width="860" height="300" rx="12" fill="url(#glow1)" clip-path="url(#outer)"/>
  <rect width="860" height="300" rx="12" fill="url(#glow2)" clip-path="url(#outer)"/>

  <!-- terminal card -->
  <rect x="24" y="24" width="812" height="252" rx="10" fill="#13131f" stroke="#2a2a40" stroke-width="1"/>

  <!-- terminal titlebar -->
  <rect x="24" y="24" width="812" height="38" rx="10" fill="#1a1a2e" clip-path="url(#terminal)"/>
  <rect x="24" y="50" width="812" height="12" fill="#1a1a2e"/>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#2a2a40" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="48" cy="43" r="5.5" fill="#ff5f57"/>
  <circle cx="66" cy="43" r="5.5" fill="#ffbd2e"/>
  <circle cx="84" cy="43" r="5.5" fill="#28c840"/>

  <!-- terminal title text -->
  <text x="430" y="47" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#555555" text-anchor="middle">saish@github ~ whoami</text>

  <!-- terminal body -->
  <!-- line 1: command -->
  <text x="48" y="92" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#7c3aed">❯ </text>
  <text x="68" y="92" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#e2e8f0">cat profile.json</text>

  <!-- JSON output -->
  <text x="58" y="116" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">{</text>

  <!-- name -->
  <text x="74" y="136" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#06b6d4">"name"</text>
  <text x="130" y="136" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">: </text>
  <text x="145" y="136" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#86efac">"Saish Baviskar"</text>
  <text x="282" y="136" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">,</text>

  <!-- role -->
  <text x="74" y="156" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#06b6d4">"role"</text>
  <text x="122" y="156" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">: </text>
  <text x="137" y="156" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#fbbf24">["AI Engineer", "ML Engineer", "Full-Stack AI Builder"]</text>
  <text x="613" y="156" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">,</text>

  <!-- currently -->
  <text x="74" y="176" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#06b6d4">"currently"</text>
  <text x="178" y="176" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">: </text>
  <text x="193" y="176" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#86efac">"Cantilever Labs · AI/ML Intern"</text>
  <text x="467" y="176" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">,</text>

  <!-- location -->
  <text x="74" y="196" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#06b6d4">"location"</text>
  <text x="170" y="196" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">: </text>
  <text x="185" y="196" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#86efac">"Pune, India"</text>
  <text x="311" y="196" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">,</text>

  <!-- focus -->
  <text x="74" y="216" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#06b6d4">"focus"</text>
  <text x="130" y="216" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">: </text>
  <text x="145" y="216" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#fbbf24">["Agentic AI", "RAG Systems", "LLM Pipelines"]</text>
  <text x="512" y="216" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">,</text>

  <!-- open to -->
  <text x="74" y="236" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#06b6d4">"status"</text>
  <text x="146" y="236" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">: </text>
  <text x="161" y="236" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#86efac">"Open to Roles"</text>

  <!-- closing brace -->
  <text x="58" y="256" font-family="'Fira Code', 'Courier New', monospace" font-size="12.5" fill="#9ca3af">}</text>

  <!-- blinking cursor line -->
  <text x="48" y="256" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#7c3aed">❯ </text>
  <rect x="68" y="244" width="8" height="14" fill="#7c3aed" opacity="0.9">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
