<svg width="860" height="400" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="85%" cy="10%" r="45%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.20"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="92%" r="35%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="termclip">
      <rect x="20" y="20" width="820" height="360" rx="12"/>
    </clipPath>
    <linearGradient id="bottomline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="30%"  style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="70%"  style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- bg + glows -->
  <rect width="860" height="400" fill="#0d0d14"/>
  <rect width="860" height="400" fill="url(#glow1)"/>
  <rect width="860" height="400" fill="url(#glow2)"/>

  <!-- terminal card -->
  <rect x="20" y="20" width="820" height="360" rx="12" fill="#13131f" stroke="#2a2a40" stroke-width="1"/>

  <!-- titlebar -->
  <rect x="20" y="20" width="820" height="44" rx="12" fill="#1a1a2e" clip-path="url(#termclip)"/>
  <rect x="20" y="52" width="820" height="12" fill="#1a1a2e"/>
  <line x1="20" y1="64" x2="840" y2="64" stroke="#2a2a40" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="46" cy="42" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="42" r="6" fill="#28c840"/>

  <!-- tab pill -->
  <rect x="250" y="28" width="360" height="28" rx="5" fill="#13131f" stroke="#2a2a40" stroke-width="1"/>
  <text x="430" y="47" font-family="'Fira Code','Courier New',monospace" font-size="12" fill="#6b7280" text-anchor="middle">saish@github: ~/profile  —  zsh</text>

  <!--
    Grid: cw=8.715px  indent=61  colon=166  value=183
    All keys right-padded to "currently" (11 chars) so colons align perfectly.
  -->

  <!-- ❯ ~ cat saish.json -->
  <text y="98" font-family="'Fira Code','Courier New',monospace" font-size="15">
    <tspan x="44" fill="#7c3aed">❯ </tspan><tspan fill="#4b5563">~ </tspan><tspan fill="#e2e8f0">cat saish.json</tspan>
  </text>

  <!-- { -->
  <text x="44" y="124" font-family="'Fira Code','Courier New',monospace" font-size="15" fill="#e2e8f0">{</text>

  <!-- "name"      : "Saish Baviskar", -->
  <text y="150" font-family="'Fira Code','Courier New',monospace" font-size="14.5">
    <tspan x="61"  fill="#06b6d4">"name"</tspan>
    <tspan x="166" fill="#6b7280">:</tspan>
    <tspan x="183" fill="#86efac">"Saish Baviskar"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "role"      : ["AI Engineer", "GenAI Engineer", "AI Builder"], -->
  <text y="176" font-family="'Fira Code','Courier New',monospace" font-size="14.5">
    <tspan x="61"  fill="#06b6d4">"role"</tspan>
    <tspan x="166" fill="#6b7280">:</tspan>
    <tspan x="183" fill="#fbbf24">[</tspan>
    <tspan x="192" fill="#a5f3fc">"AI Engineer"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#a5f3fc">"GenAI Engineer"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#a5f3fc">"AI Builder"</tspan>
    <tspan fill="#fbbf24">]</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "currently" : "AI Intern @ Cantilever Labs", -->
  <text y="202" font-family="'Fira Code','Courier New',monospace" font-size="14.5">
    <tspan x="61"  fill="#06b6d4">"currently"</tspan>
    <tspan x="166" fill="#6b7280">:</tspan>
    <tspan x="183" fill="#86efac">"AI Intern @ Cantilever Labs"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "location"  : "Pune, India 🇮🇳", -->
  <text y="228" font-family="'Fira Code','Courier New',monospace" font-size="14.5">
    <tspan x="61"  fill="#06b6d4">"location"</tspan>
    <tspan x="166" fill="#6b7280">:</tspan>
    <tspan x="183" fill="#86efac">"Pune, India 🇮🇳"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "focus"     : ["Agentic AI", "RAG Systems", "LLM Pipelines"], -->
  <text y="254" font-family="'Fira Code','Courier New',monospace" font-size="14.5">
    <tspan x="61"  fill="#06b6d4">"focus"</tspan>
    <tspan x="166" fill="#6b7280">:</tspan>
    <tspan x="183" fill="#fbbf24">[</tspan>
    <tspan x="192" fill="#c4b5fd">"Agentic AI"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#c4b5fd">"RAG Systems"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#c4b5fd">"LLM Pipelines"</tspan>
    <tspan fill="#fbbf24">]</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- "status"    : "Open to Roles 🚀" -->
  <text y="280" font-family="'Fira Code','Courier New',monospace" font-size="14.5">
    <tspan x="61"  fill="#06b6d4">"status"</tspan>
    <tspan x="166" fill="#6b7280">:</tspan>
    <tspan x="183" fill="#86efac">"Open to Roles 🚀"</tspan>
  </text>

  <!-- } -->
  <text x="44" y="306" font-family="'Fira Code','Courier New',monospace" font-size="15" fill="#e2e8f0">}</text>

  <!-- ❯ ~ | (blinking cursor) -->
  <text y="336" font-family="'Fira Code','Courier New',monospace" font-size="15">
    <tspan x="44" fill="#7c3aed">❯ </tspan><tspan fill="#4b5563">~ </tspan>
  </text>
  <rect x="79" y="322" width="9" height="16" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent line -->
  <rect x="20" y="379" width="820" height="1" fill="url(#bottomline)"/>
</svg>
