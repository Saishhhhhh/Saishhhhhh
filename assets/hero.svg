<svg width="860" height="360" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g1" cx="90%" cy="5%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="g2" cx="10%" cy="95%" r="40%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="cc">
      <rect x="20" y="16" width="820" height="328" rx="14"/>
    </clipPath>
    <linearGradient id="al" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="25%"  style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="75%"  style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="cg">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="860" height="360" fill="#0a0a12"/>
  <rect width="860" height="360" fill="url(#g1)"/>
  <rect width="860" height="360" fill="url(#g2)"/>

  <!-- card -->
  <rect x="20" y="16" width="820" height="328" rx="14" fill="#111120" stroke="#1e1e35" stroke-width="1"/>

  <!-- titlebar -->
  <rect x="20" y="16" width="820" height="44" rx="14" fill="#161628" clip-path="url(#cc)"/>
  <rect x="20" y="48" width="820" height="12" fill="#161628"/>
  <line x1="20" y1="60" x2="840" y2="60" stroke="#1e1e35" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="46" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="86" cy="38" r="6" fill="#28c840"/>

  <!-- tab pill -->
  <rect x="255" y="25" width="350" height="26" rx="6" fill="#0f0f1c" stroke="#1e1e35" stroke-width="1"/>
  <text x="430" y="43" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#4b5563" text-anchor="middle">saishhhhhh@github: ~/profile  —  zsh</text>

  <!-- prompt -->
  <text y="90" font-family="'SF Mono','Fira Code',monospace" font-size="14.5">
    <tspan x="44" fill="#a78bfa">❯ </tspan><tspan fill="#4b5563">~ </tspan><tspan fill="#e2e8f0">saishhhhhh.json</tspan>
  </text>

  <!-- { -->
  <text x="44" y="114" font-family="'SF Mono','Fira Code',monospace" font-size="14.5" fill="#e2e8f0">{</text>

  <!-- name -->
  <text y="138" font-family="'SF Mono','Fira Code',monospace" font-size="14">
    <tspan x="62" fill="#06b6d4">"name"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Saish Baviskar"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- role -->
  <text y="162" font-family="'SF Mono','Fira Code',monospace" font-size="14">
    <tspan x="62" fill="#06b6d4">"role"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#fbbf24">[</tspan>
    <tspan fill="#a5f3fc">"AI Engineer"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#a5f3fc">"Data Scientist"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#a5f3fc">"ML Engineer"</tspan>
    <tspan fill="#fbbf24">]</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- currently -->
  <text y="186" font-family="'SF Mono','Fira Code',monospace" font-size="14">
    <tspan x="62" fill="#06b6d4">"currently"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Cantilever Labs · AI Intern"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- location -->
  <text y="210" font-family="'SF Mono','Fira Code',monospace" font-size="14">
    <tspan x="62" fill="#06b6d4">"location"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#86efac">"Pune, India 🇮🇳"</tspan>
    <tspan fill="#6b7280">,</tspan>
  </text>

  <!-- focus -->
  <text y="234" font-family="'SF Mono','Fira Code',monospace" font-size="14">
    <tspan x="62" fill="#06b6d4">"focus"</tspan>
    <tspan x="158" fill="#6b7280">:</tspan>
    <tspan x="174" fill="#fbbf24">[</tspan>
    <tspan fill="#c4b5fd">"Agentic AI"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#c4b5fd">"RAG Systems"</tspan>
    <tspan fill="#6b7280">, </tspan>
    <tspan fill="#c4b5fd">"LLM Pipelines"</tspan>
    <tspan fill="#fbbf24">]</tspan>
  </text>

  <!-- } -->
  <text x="44" y="258" font-family="'SF Mono','Fira Code',monospace" font-size="14.5" fill="#e2e8f0">}</text>

  <!-- next prompt + blinking cursor -->
  <text y="284" font-family="'SF Mono','Fira Code',monospace" font-size="14.5">
    <tspan x="44" fill="#a78bfa">❯ </tspan><tspan fill="#4b5563">~ </tspan>
  </text>
  <rect x="79" y="270" width="9" height="16" rx="1" fill="#a78bfa" filter="url(#cg)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent line -->
  <rect x="20" y="342" width="820" height="2" rx="1" fill="url(#al)"/>
</svg>
